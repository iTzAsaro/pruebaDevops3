apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: vicity
  labels:
    app: vicity-frontend
    tier: frontend
spec:
  type: NodePort
  selector:
    app: vicity-frontend
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
