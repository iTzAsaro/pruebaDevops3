apiVersion: apps/v1
kind: Deployment
metadata:
  name: vicity-backend
  namespace: vicity
  labels:
    app: vicity-backend
    tier: backend
    part-of: vicity-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vicity-backend
  template:
    metadata:
      labels:
        app: vicity-backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: app-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
