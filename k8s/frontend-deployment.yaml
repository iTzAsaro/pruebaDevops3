apiVersion: apps/v1
kind: Deployment
metadata:
  name: vicity-frontend
  namespace: vicity
  labels:
    app: vicity-frontend
    tier: frontend
    part-of: vicity-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vicity-frontend
  template:
    metadata:
      labels:
        app: vicity-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: app-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: BACKEND_URL
              value: "http://backend-service:3000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
