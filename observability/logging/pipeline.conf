[SERVICE]
    Flush               5
    Log_Level           info

[INPUT]
    Name                tail
    Path                /var/log/containers/*_vicity_backend-*.log,/var/log/containers/*_vicity_frontend-*.log
    Tag                 kube.*
    multiline.parser    cri
    Read_from_Head      Off
    Skip_Long_Lines     On
    Mem_Buf_Limit       10MB

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Labels              On
    Annotations         Off
    Merge_Log           Off
    K8S-Logging.Parser  Off
    K8S-Logging.Exclude Off

@INCLUDE selection.conf
