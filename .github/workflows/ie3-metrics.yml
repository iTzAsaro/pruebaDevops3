name: IE3 - Métricas de CI

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID de la ejecución de ci.yml
        required: true
        type: string
      attempt:
        description: Número de intento exacto
        required: true
        default: '1'
        type: string
      publish:
        description: Publicar en VictoriaMetrics (requiere entorno autorizado)
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.publish && 'ie3-metrics-publish' || 'ie3-metrics-preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar recolector
        run: node --test scripts/ie3/*.test.mjs
      - name: Recolectar métricas del intento solicitado
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          SOURCE_ATTEMPT: ${{ inputs.attempt }}
          PUBLISH: ${{ inputs.publish }}
          VM_IMPORT_URL: ${{ inputs.publish && vars.VM_IMPORT_URL || '' }}
          VM_TOKEN: ${{ inputs.publish && secrets.VM_TOKEN || '' }}
        run: node scripts/ie3/collect.mjs
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ie3-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ie3-metadata.json
            ie3-metrics.prom
          if-no-files-found: ignore
          retention-days: 14
