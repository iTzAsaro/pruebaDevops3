services:
  backend:
    networks:
      - vicity_monitoring

  frontend:
    networks:
      - vicity_monitoring
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus:/etc/prometheus:ro
    networks: [vicity_monitoring, monitoring_ui]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/config/blackbox.yml"]
    volumes:
      - ./observability/blackbox:/config:ro
    networks: [vicity_monitoring]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO", "/dev/null", "http://127.0.0.1:9115/"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env.monitoring.local}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [monitoring_ui]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  vicity_monitoring:
    internal: true
  monitoring_ui:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
